<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Альбом | Геометрические фигуры</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        /* Информационная панель */
        .title-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 12px 20px;
            color: white;
            z-index: 20;
            pointer-events: none;
            border-left: 4px solid #ff6b6b;
        }

        .title-panel h1 {
            margin: 0 0 5px;
            font-size: 1.2rem;
        }

        .title-panel p {
            margin: 0;
            font-size: 0.8rem;
            opacity: 0.8;
        }

        /* Панель инструкций */
        .instruction {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 8px 16px;
            color: #ffaa66;
            font-size: 12px;
            font-family: monospace;
            z-index: 20;
            pointer-events: none;
        }

        /* Контейнер для подписей (слева) */
        .labels {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 15px;
            z-index: 20;
            pointer-events: none;
            font-family: monospace;
            font-size: 14px;
            border-right: 2px solid #ff6b6b;
            max-height: 80%;
            overflow-y: auto;
        }

        .labels div {
            margin: 8px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-dot {
            width: 14px;
            height: 14px;
            border-radius: 4px;
        }

        .labels span {
            color: #eee;
        }

        @media (max-width: 700px) {
            .labels { font-size: 10px; padding: 10px; }
            .labels div { margin: 5px 0; }
            .color-dot { width: 10px; height: 10px; }
            .title-panel h1 { font-size: 1rem; }
            .instruction { font-size: 9px; bottom: 10px; right: 10px; }
        }
    </style>
</head>
<body>
    <div class="title-panel">
        <h1>📐 Интерактивный 3D альбом</h1>
        <p>Геометрические фигуры | Наведи курсор — фигура начнёт вращаться</p>
    </div>
    <div class="labels">
        <div><div class="color-dot" style="background: #ff5252;"></div><span>🔴 Куб (гексаэдр)</span></div>
        <div><div class="color-dot" style="background: #4d8eff;"></div><span>🔵 Сфера</span></div>
        <div><div class="color-dot" style="background: #4caf50;"></div><span>🟢 Цилиндр</span></div>
        <div><div class="color-dot" style="background: #ffa726;"></div><span>🟠 Конус</span></div>
        <div><div class="color-dot" style="background: #ba68c8;"></div><span>🟣 Треугольная пирамида (тетраэдр)</span></div>
        <div><div class="color-dot" style="background: #42a5f5;"></div><span>🔷 Четырёхугольная пирамида (квадратная)</span></div>
    </div>
    <div class="instruction">
        🖱️ НАВЕДИ НА ФИГУРУ → ВРАЩАЕТСЯ<br>
        ✨ Мышь: левая кнопка — поворот камеры | скролл — зум
    </div>

    <!-- Подключаем Three.js и дополнения -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- 1. СЦЕНА, КАМЕРА, РЕНДЕРЕРЫ ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1030);
        scene.fog = new THREE.FogExp2(0x0a1030, 0.006);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(6, 4, 8);
        camera.lookAt(0, 0, 0);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.target.set(0, 0, 0);

        // --- 2. ОСВЕЩЕНИЕ ---
        const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(4, 6, 3);
        mainLight.castShadow = true;
        scene.add(mainLight);
        
        const backLight = new THREE.DirectionalLight(0x88aaff, 0.4);
        backLight.position.set(-3, 2, -4);
        scene.add(backLight);
        
        const warmLight = new THREE.PointLight(0xffaa66, 0.3);
        warmLight.position.set(2, 3, 2);
        scene.add(warmLight);
        
        const gridHelper = new THREE.GridHelper(12, 20, 0x88aaff, 0x335588);
        gridHelper.position.y = -1.4;
        scene.add(gridHelper);

        // --- 3. ФУНКЦИЯ ДЛЯ СОЗДАНИЯ ФИГУР ---
        const interactiveObjects = [];
        
        function createShape(geometry, material, position, name, rotationY = 0) {
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.position.set(position.x, position.y, position.z);
            mesh.userData = { name, originalRotation: { y: rotationY } };
            mesh.rotation.y = rotationY;
            
            const div = document.createElement('div');
            div.textContent = name;
            div.style.color = '#fff';
            div.style.fontSize = '18px';
            div.style.fontWeight = 'bold';
            div.style.textShadow = '1px 1px 2px black';
            div.style.backgroundColor = 'rgba(0,0,0,0.6)';
            div.style.padding = '6px 14px';
            div.style.borderRadius = '30px';
            div.style.borderLeft = `3px solid ${material.color.getStyle()}`;
            div.style.fontFamily = 'monospace';
            div.style.backdropFilter = 'blur(4px)';
            div.style.whiteSpace = 'nowrap';
            
            const label = new CSS2DObject(div);
            label.position.set(position.x, position.y - 1.3, position.z);
            
            scene.add(mesh);
            scene.add(label);
            
            return { mesh, label };
        }
        
        // --- 4. СОЗДАЁМ ВСЕ ФИГУРЫ ---
        const cubeGeo = new THREE.BoxGeometry(1.4, 1.4, 1.4);
        const cubeMat = new THREE.MeshStandardMaterial({ color: 0xff5252, roughness: 0.3 });
        const cube = createShape(cubeGeo, cubeMat, { x: -2.2, y: 0, z: -1.5 }, '🔴 Куб (гексаэдр)');
        
        const sphereGeo = new THREE.SphereGeometry(0.85, 64, 64);
        const sphereMat = new THREE.MeshStandardMaterial({ color: 0x4d8eff, roughness: 0.2 });
        const sphere = createShape(sphereGeo, sphereMat, { x: 2.2, y: 0, z: -1.5 }, '🔵 Сфера');
        
        const cylinderGeo = new THREE.CylinderGeometry(0.85, 0.85, 1.5, 48);
        const cylinderMat = new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.4 });
        const cylinder = createShape(cylinderGeo, cylinderMat, { x: -2.5, y: 0, z: 1.8 }, '🟢 Цилиндр');
        
        const coneGeo = new THREE.ConeGeometry(0.9, 1.7, 48);
        const coneMat = new THREE.MeshStandardMaterial({ color: 0xffa726, roughness: 0.35 });
        const cone = createShape(coneGeo, coneMat, { x: 2.5, y: 0, z: 1.8 }, '🟠 Конус');
        
        const tetraGeo = new THREE.TetrahedronGeometry(1.05);
        const tetraMat = new THREE.MeshStandardMaterial({ color: 0xba68c8, roughness: 0.3 });
        const tetra = createShape(tetraGeo, tetraMat, { x: -1.8, y: 0, z: 3.5 }, '🟣 Треугольная пирамида');
        
        const squarePyramidGeo = new THREE.CylinderGeometry(0, 1.1, 1.6, 4);
        const pyramidMat = new THREE.MeshStandardMaterial({ color: 0x42a5f5, roughness: 0.3 });
        const pyramid = createShape(squarePyramidGeo, pyramidMat, { x: 1.8, y: 0, z: 3.5 }, '🔷 Четырёхугольная пирамида');
        pyramid.mesh.rotation.y = Math.PI / 4;
        
        const shapes = [cube, sphere, cylinder, cone, tetra, pyramid];
        
        // --- 5. ВРАЩЕНИЕ ПРИ НАВЕДЕНИИ ---
        let currentHovered = null;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const meshes = shapes.map(s => s.mesh);
            const intersects = raycaster.intersectObjects(meshes);
            
            if (intersects.length > 0) {
                const hit = intersects[0].object;
                if (currentHovered !== hit) {
                    if (currentHovered) currentHovered.userData.isHovering = false;
                    currentHovered = hit;
                    currentHovered.userData.isHovering = true;
                }
            } else {
                if (currentHovered) {
                    currentHovered.userData.isHovering = false;
                    currentHovered = null;
                }
            }
        });
        
        // --- 6. АНИМАЦИЯ ---
        function animate() {
            requestAnimationFrame(animate);
            shapes.forEach(shape => {
                if (shape.mesh.userData.isHovering) {
                    shape.mesh.rotation.y += 0.018;
                    shape.mesh.rotation.x += 0.005;
                    shape.mesh.rotation.z += 0.003;
                }
            });
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();
        
        // --- 7. АДАПТАЦИЯ ПОД РАЗМЕР ОКНА ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
